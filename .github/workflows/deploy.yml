name: Deploy to Zenbox FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: piatyzywiolkalisz.pl
          username: ftp@piatyzywiolkalisz.pl
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /home/zywiol/domains/piatyzywiolkalisz.pl/
          port: 21
